# This repository's own CI, and the worked example the README points at: `ci`
# building `ci`.
#
# One job with one product — the release binary. Checks (fmt, clippy, tests) are
# deliberately absent for now; see "Adding checks" in the README, which is also
# where the toolchain caveat that makes them non-trivial is written down.
name: build
on: [submit]

jobs:
  release:
    # The host this orchestrator is running on. `default` is a *host* node, so
    # the `vm:` block below still applies — the build runs in a VM built on this
    # machine, not on the machine itself.
    #
    # Deliberate for this repository: it is the one workflow whose failures are
    # this project's own bug, so it exercises the `default` form on hardware
    # that is by definition present. Point it elsewhere with
    # `uses: <network>/<node>`, or drop the line entirely to inherit whatever
    # network the repository is assigned on /repos.
    uses: default
    vm:
      driver: firecracker
      # Built from deploy/image/Dockerfile with `heyvm mvm build`. Not a public
      # base image: the daemon resolves a bare name against
      # ~/.heyo/images/firecracker/{name}.ext4, so this must be built on any
      # host that runs this job. See deploy/image/README.md.
      image: ci-rust
      size_class: medium
      # Mounted at /var/cache/ci by the image's init, which is where
      # CARGO_TARGET_DIR points — deliberately *not* /workspace, which `ci`
      # wipes on every checkout. This disk is what makes reusing a warm VM
      # worth anything.
      disk_size_gb: 20
      # No setup_hooks: the toolchain, git and the OpenSSL headers are in the
      # image. Hooks run on every cold VM, so baking them in is the difference
      # between a build that starts in seconds and one that apt-gets a
      # toolchain first.
      #
      # A dependency change is the one thing that must not reuse a warm VM: the
      # cached registry and `target/` in it were resolved against the old
      # lockfile. `rust-toolchain.toml` is listed although this repository has
      # none — a missing file hashes to an explicit marker, so adding one later
      # busts the pool at the moment it most needs busting.
      cache_key_files:
        - Cargo.lock
        - rust-toolchain.toml
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Build
        # No `. "$HOME/.cargo/env"`: the image puts cargo on PATH through
        # /etc/profile.d, and the daemon runs every step as `sh -lc`, which is a
        # login shell and reads it.
        #
        # `--locked` because the VM is fingerprinted on `Cargo.lock`: resolving
        # a different dependency set than the one the fingerprint was taken
        # from would make the warm VM's cache a claim that is not true.
        run: cargo build --release --locked
        # A cold build of ~300 crates is well past the 30-minute default. A warm
        # VM reuses the cache on /var/cache/ci and takes a fraction of this.
        timeout-minutes: 60
      # `ci/upload-artifact` tars its `path` relative to the working directory,
      # and CARGO_TARGET_DIR is outside it — so the binary is brought back in
      # rather than the uploader taught about absolute paths.
      - name: Collect the binary
        run: mkdir -p dist && cp "$CARGO_TARGET_DIR/release/ci" dist/ci
      - uses: ci/upload-artifact
        with:
          name: ci
          path: dist
